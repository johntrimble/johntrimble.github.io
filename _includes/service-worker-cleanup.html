<script>
  /* Remove service workers left behind by the previously enabled Chirpy PWA.
     Keep this in place long enough for returning visitors to load it. */

  (async () => {
    if ('serviceWorker' in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations().catch(() => []);
      await Promise.allSettled(registrations.map((registration) => registration.unregister()));
    }

    if ('caches' in window) {
      const cacheNames = await caches.keys().catch(() => []);
      const chirpyCaches = cacheNames.filter((name) => name.startsWith('chirpy-'));
      await Promise.allSettled(chirpyCaches.map((name) => caches.delete(name)));
    }
  })();
</script>
